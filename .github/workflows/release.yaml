name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths:
      - .github/workflows/release.yaml
      - scripts/package-release.sh
      - scripts/check_publication.py
      - tests/workflows/**
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make check test test-race
      - run: make test-integration
      - run: make vuln
      - name: Package verified release
        id: version
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0' }}
        run: |
          sh scripts/package-release.sh "$VERSION"
          mkdir release-artifacts
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            cp "dist/routetus_${VERSION}_${target}.tar.gz" release-artifacts/
          done
          cp dist/checksums.txt docs/release_notes.md release-artifacts/
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: verified-release
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 3
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: dist
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          merge-multiple: true
          path: dist
      - run: sha256sum --strict --check checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: gh release create "$VERSION" routetus_"$VERSION"_linux_amd64.tar.gz routetus_"$VERSION"_linux_arm64.tar.gz routetus_"$VERSION"_darwin_amd64.tar.gz routetus_"$VERSION"_darwin_arm64.tar.gz checksums.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "Routetus $VERSION" --notes-file release_notes.md
