name: routeqtus
x-gateway: &gateway
  image: routeqtus:local
  build: .
  user: "${ROUTEQTUS_UID:-65532}:${ROUTEQTUS_GID:-65532}"
  volumes:
    - ./examples:/examples:ro
    - ./.demo:/demo:ro
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  postgres:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: routeqtus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make demo first}
      SERVE_DB_PASSWORD: ${SERVE_DB_PASSWORD:?Run make demo first}
      MANAGE_DB_PASSWORD: ${MANAGE_DB_PASSWORD:?Run make demo first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./examples/docker/init-roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d routeqtus"]
      interval: 2s
      timeout: 2s
      retries: 15
  migrate:
    <<: *gateway
    profiles: [tools]
    command: [migrate, --config, /examples/bootstrap.yaml]
    environment:
      # Local demo network only. Production requires sslmode=verify-full.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/routeqtus?sslmode=disable
  permissions:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    profiles: [tools]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [./examples/docker/permissions.sql:/permissions.sql:ro]
    command: [psql, -h, postgres, -U, postgres, -d, routeqtus, -v, ON_ERROR_STOP=1, -f, /permissions.sql]
  manage:
    <<: *gateway
    command: [manage, --config, /examples/docker/manage.yaml]
    environment:
      DATABASE_URL: postgres://routeqtus_manage:${MANAGE_DB_PASSWORD}@postgres:5432/routeqtus?sslmode=disable
      ROUTEQTUS_MANAGEMENT_TOKEN: ${ROUTEQTUS_MANAGEMENT_TOKEN:?Run make demo first}
    ports: ["127.0.0.1:9080:9080"]
    depends_on:
      postgres: {condition: service_healthy}
  publish:
    <<: *gateway
    profiles: [tools]
    command: [config, apply, --api, "https://manage:9080", --file, /examples/config.json, --generation, "0", --description, "Initial demo configuration"]
    environment:
      SSL_CERT_FILE: /demo/tls/cert.pem
      ROUTEQTUS_MANAGEMENT_TOKEN: ${ROUTEQTUS_MANAGEMENT_TOKEN}
  serve:
    <<: *gateway
    command: [serve, --config, /examples/docker/serve.yaml]
    environment:
      DATABASE_URL: postgres://routeqtus_serve:${SERVE_DB_PASSWORD}@postgres:5432/routeqtus?sslmode=disable
      ROUTEQTUS_ADMIN_TOKEN: ${ROUTEQTUS_ADMIN_TOKEN:?Run make demo first}
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:9090:9090"]
    depends_on:
      postgres: {condition: service_healthy}
  backend-a:
    <<: *gateway
    entrypoint: [/demo-backend]
    environment:
      DEMO_BACKEND_NAME: backend-a
  backend-b:
    <<: *gateway
    entrypoint: [/demo-backend]
    environment:
      DEMO_BACKEND_NAME: backend-b
volumes:
  postgres-data:
