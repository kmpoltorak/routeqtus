version: 1
server:
  listen: ":8080"
  read_header_timeout: "5s"
  idle_timeout: "60s"
  request_timeout: "15s"
  shutdown_timeout: "10s"
  max_header_bytes: 16384
  max_body_bytes: 16777216
  max_in_flight: 2048
admin:
  listen: "127.0.0.1:9090"
  metrics: true
  pprof: false
management:
  listen: "127.0.0.1:9080"
  auth_token_env: "ROUTETUS_MANAGEMENT_TOKEN"
  principal: "management-token"
  request_timeout: "10s"
  max_body_bytes: 4194304
  max_in_flight: 32
logging:
  level: "info"
  format: "json"
postgres:
  dsn_env: "DATABASE_URL"
  max_conns: 4
  min_conns: 0
  connect_timeout: "3s"
  query_timeout: "2s"
  max_conn_lifetime: "30m"
config_sync:
  startup_timeout: "30s"
  poll_interval: "10s"
  max_staleness: "5m"
  notifications: true
# Keep limits identical on every serve and manage process.
limits:
  max_entities: 10000
  max_targets: 1024
  max_connections: 100000
  max_priority: 1000000
  max_sample_every: 1000000
  max_powered_characters: 128
  max_identifier_length: 64
